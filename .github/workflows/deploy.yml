name: Build & deploy site

# Rebuilds the static site from Sanity and commits the result back to a target
# branch. GitHub Pages (Deploy from a branch) then serves whichever branch it is
# configured for.
#
# The workflow FILE must live on the default branch (main) for GitHub to run it
# on repository_dispatch / the manual button. But it can build ANY branch:
#   - repository_dispatch: builds github.event.client_payload.ref
#       (Sanity webhook projection: { "event_type": "sanity-publish",
#        "client_payload": { "ref": "feature/add-fleat" } })
#   - workflow_dispatch: builds the branch you pick in the Run-workflow UI
# Falls back to the default branch when no ref is supplied.

on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deploy-${{ github.event.client_payload.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: target
        run: echo "ref=${{ github.event.client_payload.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site from Sanity
        env:
          USE_SANITY: 'true'
        run: npm run build

      - name: Commit regenerated site
        run: |
          git config user.name  "aiyachts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: rebuild site from Sanity [skip ci]"
            git push origin HEAD:${{ steps.target.outputs.ref }}
          fi


